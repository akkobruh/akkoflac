<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AkkoFlac Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f5f5f7}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 5%,#7b8cff3d,transparent 35%),radial-gradient(circle at 90% 90%,#7b8cff24,transparent 35%),linear-gradient(180deg,#252631,#15161d);padding:28px}.orb{position:fixed;border-radius:50%;filter:blur(55px);pointer-events:none;opacity:.35}.o1{width:300px;height:300px;top:-100px;right:8%;background:#7b8cff}.o2{width:240px;height:240px;bottom:-80px;left:8%;background:#b56cff}.glass{background:#ffffff0d;border:1px solid #ffffff1a;backdrop-filter:blur(35px) saturate(1.3);-webkit-backdrop-filter:blur(35px) saturate(1.3);box-shadow:0 25px 70px #0007,inset 0 1px #ffffff14}.shell{position:relative;z-index:1;width:min(900px,100%);margin:auto}.brand{font-size:13px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#bfc6ff;margin:0 0 14px 5px}.card{border-radius:28px;padding:34px}.login{width:min(440px,100%);margin:10vh auto}.h{font-size:34px;letter-spacing:-1.4px;margin-bottom:9px}.sub{color:#aaaab8;font-size:13px;line-height:1.6;margin-bottom:26px}.input{width:100%;height:52px;border-radius:15px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;outline:0;padding:0 16px;font-size:15px;margin-bottom:12px}.input:focus{border-color:#7b8cff88;box-shadow:0 0 0 3px #7b8cff22}.btn{height:50px;border:0;border-radius:15px;background:#7b8cff;color:#10111a;font-weight:700;padding:0 20px;cursor:pointer;box-shadow:0 9px 28px #7b8cff45;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.secondary{background:#ffffff0b;color:#fff;border:1px solid #ffffff16;box-shadow:none}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.error{min-height:18px;color:#ff929f;font-size:12px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff10}.stat b{display:block;font-size:26px;margin-bottom:4px}.stat span{font-size:11px;color:#9d9dab}.code-list{display:grid;gap:10px}.code{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;border-radius:17px;background:#ffffff08;border:1px solid #ffffff0e}.code strong{font-size:22px;letter-spacing:4px}.code small{display:block;color:#898996;font-size:10px;margin-top:4px}.copy{height:38px;padding:0 14px;border-radius:11px;border:1px solid #ffffff14;background:#ffffff0b;color:#fff;cursor:pointer}.empty{text-align:center;color:#898996;padding:38px 10px;font-size:13px}.toast{position:fixed;z-index:5;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:13px;background:#292a34eF;border:1px solid #ffffff18;backdrop-filter:blur(20px);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){body{padding:14px}.card{padding:24px;border-radius:22px}.top{align-items:flex-start;flex-direction:column}.actions,.actions .btn{width:100%}.h{font-size:28px}.code strong{font-size:19px}}
</style>
</head>
<body><div class="orb o1"></div><div class="orb o2"></div><main class="shell" id="app"></main><div class="toast" id="toast"></div>
<script>
const app=document.getElementById('app'),toast=document.getElementById('toast');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1600)}
function login(){app.innerHTML=`<section class="card glass login"><div class="brand">AKKOFLAC · ADMIN</div><h1 class="h">Code Control</h1><p class="sub">Sign in to generate and manage one-time access codes.</p><form id="loginForm"><input class="input" id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button class="btn" style="width:100%">Sign in</button><div class="error" id="error"></div></form></section>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){document.getElementById('error').textContent=d.error||'Login failed.';return}dashboard()}}
async function getCodes(){const r=await fetch('/.netlify/functions/list-codes',{cache:'no-store'});if(r.status===401){login();return null}const d=await r.json();return d.codes||[]}
async function dashboard(){app.innerHTML=`<section class="card glass"><div class="top"><div><div class="brand">AKKOFLAC · ADMIN</div><h1 class="h">Access Codes</h1><p class="sub">Generate 5-character codes. Each code works once, then permanently becomes invalid.</p></div><div class="actions"><button class="btn" id="generate">Generate Code</button><button class="btn secondary" id="refresh">Refresh</button></div></div><div class="stats"><div class="stat"><b id="count">—</b><span>ACTIVE CODES</span></div><div class="stat"><b>5</b><span>CHARACTERS PER CODE</span></div></div><div class="code-list" id="codes"></div></section>`;document.getElementById('generate').onclick=async()=>{const r=await fetch('/.netlify/functions/generate-code',{method:'POST'});const d=await r.json();if(!r.ok){showToast(d.error||'Could not generate');return}await load();try{await navigator.clipboard.writeText(d.code.code)}catch{}showToast('Generated '+d.code.code)};document.getElementById('refresh').onclick=load;await load()}
async function load(){const codes=await getCodes();if(!codes)return;document.getElementById('count').textContent=codes.length;const box=document.getElementById('codes');if(!codes.length){box.innerHTML='<div class="empty">No active codes yet.<br>Generate one above.</div>';return}box.innerHTML=codes.map(c=>`<div class="code"><div><strong>${esc(c.code)}</strong><small>Created ${new Date(c.created_at).toLocaleString()}</small></div><button class="copy" data-code="${esc(c.code)}">Copy</button></div>`).join('');box.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);showToast('Copied '+b.dataset.code)}catch{showToast('Copy failed')}})}
login();
</script></body></html>

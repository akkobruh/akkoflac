<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkkoFlac</title>

    <!-- Modern readable font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #161616;
            --bg-deep: #111111;
            --surface: #1b1b1b;
            --surface-light: #202020;

            --orange: #ff6500;
            --orange-soft: rgba(255, 101, 0, 0.18);

            --text: #f5f5f5;
            --muted: #888888;

            --border: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            padding: 32px 22px;

            background: var(--bg-deep);
            border-right: 1px solid var(--border);

            z-index: 20;

            transition: opacity 0.35s ease;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;

            color: var(--orange);

            letter-spacing: 2px;

            margin-bottom: 50px;
        }

        .nav {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .nav button {
            width: 100%;

            text-align: left;

            padding: 15px 17px;

            border-radius: 13px;

            background: transparent;

            color: var(--muted);

            font-size: 15px;
            font-weight: 500;

            transition: 0.25s ease;
        }

        .nav button:hover {
            color: var(--text);

            background: var(--surface);
        }

        .nav button.active {
            color: var(--orange);

            background: var(--surface);

            box-shadow:
                inset 3px 0 0 var(--orange),
                0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 230px;

            width: calc(100% - 230px);

            height: 100vh;

            overflow-y: auto;

            padding-bottom: 120px;

            transition: opacity 0.35s ease;
        }

        .main.hidden {
            opacity: 0;

            pointer-events: none;
        }

        .header {
            position: sticky;

            top: 0;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 25px;

            padding: 30px 42px;

            background: rgba(22, 22, 22, 0.9);

            backdrop-filter: blur(18px);
        }

        .header h1 {
            font-size: 30px;

            font-weight: 700;
        }

        .search {
            width: min(400px, 45vw);

            padding: 14px 18px;

            border: none;
            outline: none;

            border-radius: 15px;

            background: var(--surface);

            color: var(--text);

            font-size: 14px;

            box-shadow:
                inset 4px 4px 10px rgba(0, 0, 0, 0.35),
                inset -4px -4px 10px rgba(255, 255, 255, 0.02);
        }

        .search::placeholder {
            color: #666;
        }

        /* =========================
           PAGES
        ========================= */

        .page {
            display: none;

            padding: 10px 42px 50px;
        }

        .page.active {
            display: block;
        }

        /* =========================
           FEATURED
        ========================= */

        .featured {
            min-height: 310px;

            border-radius: 25px;

            padding: 40px;

            background:
                linear-gradient(
                    135deg,
                    #202020,
                    #171717
                );

            display: flex;

            justify-content: space-between;
            align-items: center;

            overflow: hidden;

            position: relative;

            box-shadow:
                12px 12px 30px rgba(0, 0, 0, 0.35),
                -8px -8px 25px rgba(255, 255, 255, 0.015);
        }

        .featured-info {
            position: relative;

            z-index: 2;
        }

        .featured-label {
            color: var(--orange);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            margin-bottom: 13px;
        }

        .featured h2 {
            font-size: clamp(30px, 4vw, 54px);

            font-weight: 700;

            max-width: 650px;

            line-height: 1;

            margin-bottom: 12px;
        }

        .featured-artist {
            color: var(--muted);

            font-size: 17px;

            margin-bottom: 25px;
        }

        .featured-play {
            padding: 13px 22px;

            border-radius: 13px;

            background: var(--orange);

            color: #111;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 8px 25px rgba(255, 101, 0, 0.2);

            transition: 0.2s ease;
        }

        .featured-play:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255, 101, 0, 0.3);
        }

        .featured-cover {
            width: 245px;
            height: 245px;

            object-fit: cover;

            border-radius: 20px;

            box-shadow:
                15px 15px 30px rgba(0, 0, 0, 0.45),
                -5px -5px 20px rgba(255, 255, 255, 0.025);
        }

        /* =========================
           SECTION HEADERS
        ========================= */

        .section-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin: 40px 0 20px;
        }

        .section-header h2 {
            font-size: 21px;

            font-weight: 600;
        }

        .section-header span {
            color: #666;

            font-size: 13px;
        }

        /* =========================
           SONG GRID
        ========================= */

        .song-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(190px, 1fr)
                );

            gap: 22px;
        }

        .song-card {
            position: relative;

            padding: 14px;

            border-radius: 18px;

            background: var(--surface);

            cursor: pointer;

            min-width: 0;

            box-shadow:
                8px 8px 20px rgba(0, 0, 0, 0.28),
                -5px -5px 16px rgba(255, 255, 255, 0.015);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .song-card:hover {
            transform: translateY(-5px);

            box-shadow:
                10px 14px 25px rgba(0, 0, 0, 0.38),
                0 0 25px rgba(255, 101, 0, 0.07);
        }

        .song-cover {
            width: 100%;

            aspect-ratio: 1;

            object-fit: cover;

            border-radius: 13px;

            display: block;

            margin-bottom: 14px;
        }

        .song-title {
            font-size: 15px;

            font-weight: 500;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            padding-right: 30px;
        }

        .song-artist {
            color: var(--muted);

            margin-top: 5px;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .like-button {
            position: absolute;

            right: 13px;

            bottom: 13px;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #151515;

            color: #777;

            font-size: 19px;

            transition: 0.2s ease;
        }

        .like-button:hover,
        .like-button.liked {
            color: var(--orange);
        }

        /* =========================
           BOTTOM PLAYER
        ========================= */

        .bottom-player {
            position: fixed;

            bottom: 18px;

            left: 250px;
            right: 20px;

            height: 82px;

            border-radius: 20px;

            background: rgba(27, 27, 27, 0.96);

            backdrop-filter: blur(18px);

            border: 1px solid var(--border);

            display: flex;

            align-items: center;

            padding: 12px 18px;

            gap: 16px;

            z-index: 30;

            box-shadow:
                12px 12px 30px rgba(0, 0, 0, 0.45),
                -5px -5px 18px rgba(255, 255, 255, 0.015);
        }

        .bottom-player.hidden {
            display: none;
        }

        .mini-cover {
            width: 56px;
            height: 56px;

            object-fit: cover;

            border-radius: 10px;

            flex-shrink: 0;
        }

        .mini-info {
            min-width: 150px;

            max-width: 260px;
        }

        .mini-title {
            font-size: 14px;

            font-weight: 500;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .mini-artist {
            color: var(--muted);

            font-size: 12px;

            margin-top: 4px;
        }

        .player-controls {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .control {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #181818;

            color: #aaa;

            font-size: 15px;

            transition: 0.2s ease;
        }

        .control:hover {
            color: var(--orange);

            background: #202020;
        }

        .play-button {
            background: var(--orange);

            color: #111;

            font-size: 14px;
        }

        .progress-area {
            flex: 1;

            min-width: 80px;
        }

        .progress,
        .now-progress {
            width: 100%;

            accent-color: var(--orange);

            cursor: pointer;
        }

        /* =========================
           FULL SCREEN PLAYER
        ========================= */

        .now-playing {
            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 25% 50%,
                    rgba(255, 101, 0, 0.07),
                    transparent 35%
                ),
                #111;

            z-index: 100;

            display: none;

            grid-template-columns: 46% 54%;

            overflow: hidden;
        }

        .now-playing.open {
            display: grid;
        }

        .now-left {
            position: relative;

            height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 50px;
        }

        .back-button {
            position: absolute;

            top: 28px;
            left: 30px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: var(--surface);

            color: #aaa;

            font-size: 22px;

            transition: 0.2s ease;
        }

        .back-button:hover {
            color: var(--orange);
        }

        .now-cover {
            width: min(440px, 34vw);

            height: min(440px, 34vw);

            object-fit: cover;

            border-radius: 25px;

            box-shadow:
                25px 25px 50px rgba(0, 0, 0, 0.5),
                -10px -10px 30px rgba(255, 255, 255, 0.015);
        }

        .now-title {
            margin-top: 28px;

            font-size: 28px;

            font-weight: 600;

            text-align: center;

            max-width: 600px;
        }

        .now-artist {
            color: var(--muted);

            font-size: 15px;

            margin-top: 7px;
        }

        .now-controls {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 28px;
        }

        .now-control {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: var(--surface);

            color: #aaa;

            font-size: 16px;

            transition: 0.2s ease;
        }

        .now-control:hover {
            color: var(--orange);
        }

        .now-play {
            width: 62px;
            height: 62px;

            background: var(--orange);

            color: #111;

            font-size: 18px;
        }

        .now-progress-area {
            width: min(620px, 80%);

            margin-top: 22px;
        }

        .time-row {
            display: flex;

            justify-content: space-between;

            color: #666;

            font-size: 12px;

            margin-top: 5px;
        }

        /* =========================
           LYRICS
        ========================= */

        .now-right {
            height: 100vh;

            padding: 70px;

            display: flex;

            flex-direction: column;

            min-height: 0;
        }

        .lyrics-heading {
            color: var(--orange);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 3px;

            margin-bottom: 25px;

            flex-shrink: 0;
        }

        .lyrics-scroll {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding-right: 25px;

            scroll-behavior: smooth;
        }

        .lyrics-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .lyrics-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .lyrics-scroll::-webkit-scrollbar-thumb {
            background: #333;

            border-radius: 10px;
        }

        #lyricsContainer {
            padding: 180px 0;
        }

        .lyric-line {
            color: #f5f5f5;

            opacity: 0.72;

            font-size: clamp(20px, 2vw, 31px);

            font-weight: 500;

            line-height: 1.5;

            margin: 18px 0;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        /* CURRENT LYRIC */

        .lyric-line.active {
            color: var(--orange);

            opacity: 1;

            transform: none;

            text-shadow:
                0 0 18px rgba(255, 101, 0, 0.35);
        }

        /* PAST LYRICS */

        .lyric-line.past {
            color: #777777;

            opacity: 0.55;

            transform: none;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;

                width: calc(100% - 190px);
            }

            .bottom-player {
                left: 210px;
            }

            .featured-cover {
                width: 190px;
                height: 190px;
            }

            .now-playing {
                grid-template-columns: 42% 58%;
            }

            .now-right {
                padding: 60px 35px;
            }
        }

        @media (max-width: 750px) {

            body {
                overflow: auto;
            }

            .sidebar {
                position: fixed;

                width: 100%;

                height: 70px;

                bottom: 0;
                top: auto;

                padding: 0 15px;

                display: flex;

                align-items: center;

                border-right: none;

                border-top: 1px solid var(--border);
            }

            .logo {
                display: none;
            }

            .nav {
                width: 100%;

                flex-direction: row;

                justify-content: center;
            }

            .nav button {
                text-align: center;

                padding: 12px;
            }

            .main {
                margin-left: 0;

                width: 100%;

                height: auto;

                min-height: 100vh;

                padding-bottom: 150px;
            }

            .header {
                padding: 22px;

                flex-direction: column;

                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .page {
                padding: 5px 22px 40px;
            }

            .featured {
                min-height: 250px;

                padding: 25px;
            }

            .featured-cover {
                width: 130px;
                height: 130px;
            }

            .featured h2 {
                font-size: 30px;
            }

            .bottom-player {
                left: 12px;

                right: 12px;

                bottom: 82px;

                height: 74px;
            }

            .mini-info {
                min-width: 0;

                max-width: 130px;
            }

            .player-controls .control:nth-child(1),
            .player-controls .control:nth-child(5),
            .player-controls .control:nth-child(6) {
                display: none;
            }

            .now-playing {
                display: none;

                grid-template-columns: 1fr;

                overflow-y: auto;
            }

            .now-playing.open {
                display: block;
            }

            .now-left {
                height: auto;

                min-height: 100vh;

                padding: 75px 25px 40px;
            }

            .now-cover {
                width: min(80vw, 360px);

                height: min(80vw, 360px);
            }

            .now-right {
                height: 70vh;

                padding: 30px 25px;
            }

            #lyricsContainer {
                padding: 100px 0;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            AKKOFLAC
        </div>

        <nav class="nav">

            <button
                class="active"
                data-page="home"
                onclick="showPage('home', this)"
            >
                Home
            </button>

            <button
                data-page="songs"
                onclick="showPage('songs', this)"
            >
                Songs
            </button>

            <button
                data-page="liked"
                onclick="showPage('liked', this)"
            >
                Liked
            </button>

        </nav>

    </aside>

    <!-- MAIN -->

    <main class="main" id="main">

        <header class="header">

            <h1 id="pageTitle">
                AkkoFlac
            </h1>

            <input
                class="search"
                id="search"
                type="text"
                placeholder="Search music..."
            >

        </header>

        <!-- HOME -->

        <section
            class="page active"
            id="home"
        >

            <div class="featured">

                <div class="featured-info">

                    <div class="featured-label">
                        FEATURED
                    </div>

                    <h2 id="featuredTitle">
                        Here (Lucian Remix)
                    </h2>

                    <div
                        class="featured-artist"
                        id="featuredArtist"
                    >
                        Alessia Cara
                    </div>

                    <button
                        class="featured-play"
                        onclick="playFeatured()"
                    >
                        Play Now
                    </button>

                </div>

                <img
                    class="featured-cover"
                    id="featuredCover"
                    src="covers/here.jfif"
                    alt=""
                >

            </div>

            <div class="section-header">

                <h2>
                    Recently Added
                </h2>

                <span>
                    Your music
                </span>

            </div>

            <div
                class="song-grid"
                id="recentGrid"
            ></div>

            <div class="section-header">

                <h2>
                    All Music
                </h2>

                <span>
                    Library
                </span>

            </div>

            <div
                class="song-grid"
                id="homeGrid"
            ></div>

        </section>

        <!-- SONGS -->

        <section
            class="page"
            id="songs"
        >

            <div class="section-header">

                <h2>
                    All Songs
                </h2>

                <span>
                    Your library
                </span>

            </div>

            <div
                class="song-grid"
                id="songsGrid"
            ></div>

        </section>

        <!-- LIKED -->

        <section
            class="page"
            id="liked"
        >

            <div class="section-header">

                <h2>
                    Liked Songs
                </h2>

                <span>
                    Favorites
                </span>

            </div>

            <div
                class="song-grid"
                id="likedGrid"
            ></div>

        </section>

    </main>

    <!-- BOTTOM PLAYER -->

    <div
        class="bottom-player hidden"
        id="bottomPlayer"
    >

        <img
            class="mini-cover"
            id="miniCover"
            src=""
            alt=""
        >

        <div class="mini-info">

            <div
                class="mini-title"
                id="miniTitle"
            >
                Nothing playing
            </div>

            <div
                class="mini-artist"
                id="miniArtist"
            >
                —
            </div>

        </div>

        <div class="player-controls">

            <button
                class="control"
                onclick="previousSong()"
            >
                ⏮
            </button>

            <button
                class="control"
                onclick="seekBack()"
            >
                ↶
            </button>

            <button
                class="control play-button"
                id="miniPlay"
                onclick="togglePlay()"
            >
                ▶
            </button>

            <button
                class="control"
                onclick="seekForward()"
            >
                ↷
            </button>

            <button
                class="control"
                onclick="nextSong()"
            >
                ⏭
            </button>

            <button
                class="control"
                onclick="toggleRepeat()"
            >
                ↻
            </button>

        </div>

        <div class="progress-area">

            <input
                class="progress"
                id="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

        </div>

    </div>

    <!-- FULL SCREEN PLAYER -->

    <section
        class="now-playing"
        id="nowPlaying"
    >

        <div class="now-left">

            <button
                class="back-button"
                onclick="closeNowPlaying()"
            >
                ←
            </button>

            <img
                class="now-cover"
                id="nowCover"
                src=""
                alt=""
            >

            <h2
                class="now-title"
                id="nowTitle"
            ></h2>

            <div
                class="now-artist"
                id="nowArtist"
            ></div>

            <div class="now-controls">

                <button
                    class="now-control"
                    onclick="previousSong()"
                >
                    ⏮
                </button>

                <button
                    class="now-control"
                    onclick="seekBack()"
                >
                    ↶
                </button>

                <button
                    class="now-control now-play"
                    id="nowPlay"
                    onclick="togglePlay()"
                >
                    ▶
                </button>

                <button
                    class="now-control"
                    onclick="seekForward()"
                >
                    ↷
                </button>

                <button
                    class="now-control"
                    onclick="nextSong()"
                >
                    ⏭
                </button>

                <button
                    class="now-control"
                    onclick="toggleRepeat()"
                >
                    ↻
                </button>

            </div>

            <div class="now-progress-area">

                <input
                    class="now-progress"
                    id="nowProgress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <div class="time-row">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

            </div>

        </div>

        <!-- LYRICS -->

        <div class="now-right">

            <div class="lyrics-heading">
                LYRICS
            </div>

            <div
                class="lyrics-scroll"
                id="lyricsScroll"
            >

                <div
                    id="lyricsContainer"
                ></div>

            </div>

        </div>

    </section>

    <audio id="audio"></audio>

    <script>

        /* =========================
           MUSIC LIBRARY
        ========================= */

        const songs = [

            {
                id: "here",

                title: "Here (Lucian Remix)",

                artist: "Alessia Cara",

                album: "Here",

                audio: "music/here.flac",

                cover: "covers/here.jfif",

                lyrics: "lyrics/here.lrc"
            }

        ];

        /* =========================
           ELEMENTS
        ========================= */

        const audio =
            document.getElementById("audio");

        const main =
            document.getElementById("main");

        const sidebar =
            document.getElementById("sidebar");

        const bottomPlayer =
            document.getElementById("bottomPlayer");

        const nowPlaying =
            document.getElementById("nowPlaying");

        const miniCover =
            document.getElementById("miniCover");

        const miniTitle =
            document.getElementById("miniTitle");

        const miniArtist =
            document.getElementById("miniArtist");

        const nowCover =
            document.getElementById("nowCover");

        const nowTitle =
            document.getElementById("nowTitle");

        const nowArtist =
            document.getElementById("nowArtist");

        const miniPlay =
            document.getElementById("miniPlay");

        const nowPlay =
            document.getElementById("nowPlay");

        const progress =
            document.getElementById("progress");

        const nowProgress =
            document.getElementById("nowProgress");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");

        const lyricsContainer =
            document.getElementById("lyricsContainer");

        const search =
            document.getElementById("search");

        /* =========================
           STATE
        ========================= */

        let currentIndex = 0;

        let currentLyrics = [];

        let repeat = false;

        let lastActiveIndex = -1;

        let likedSongs =
            JSON.parse(
                localStorage.getItem("likedSongs") || "[]"
            );

        /* =========================
           FEATURED
        ========================= */

        function renderFeatured() {

            if (!songs.length) return;

            const song = songs[0];

            document.getElementById(
                "featuredTitle"
            ).textContent = song.title;

            document.getElementById(
                "featuredArtist"
            ).textContent = song.artist;

            document.getElementById(
                "featuredCover"
            ).src = song.cover;

        }

        function playFeatured() {

            if (!songs.length) return;

            playSong(0);

        }

        /* =========================
           SONG CARDS
        ========================= */

        function createSongCard(song, index) {

            const liked =
                likedSongs.includes(song.id);

            const card =
                document.createElement("div");

            card.className = "song-card";

            card.innerHTML = `
                <img
                    class="song-cover"
                    src="${song.cover}"
                    alt=""
                >

                <div class="song-title">
                    ${song.title}
                </div>

                <div class="song-artist">
                    ${song.artist}
                </div>

                <button
                    class="like-button ${liked ? "liked" : ""}"
                    data-like="${song.id}"
                >
                    ${liked ? "♥" : "♡"}
                </button>
            `;

            card.addEventListener(
                "click",
                () => playSong(index)
            );

            const likeButton =
                card.querySelector(".like-button");

            likeButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleLike(song.id);

                }
            );

            return card;
        }

        function renderSongs() {

            const homeGrid =
                document.getElementById("homeGrid");

            const recentGrid =
                document.getElementById("recentGrid");

            const songsGrid =
                document.getElementById("songsGrid");

            const likedGrid =
                document.getElementById("likedGrid");

            homeGrid.innerHTML = "";

            recentGrid.innerHTML = "";

            songsGrid.innerHTML = "";

            likedGrid.innerHTML = "";

            songs.forEach((song, index) => {

                homeGrid.appendChild(
                    createSongCard(song, index)
                );

            });

            songs
                .slice()
                .reverse()
                .forEach(song => {

                    const index =
                        songs.indexOf(song);

                    recentGrid.appendChild(
                        createSongCard(song, index)
                    );

                });

            songs.forEach((song, index) => {

                songsGrid.appendChild(
                    createSongCard(song, index)
                );

            });

            songs.forEach((song, index) => {

                if (
                    likedSongs.includes(song.id)
                ) {

                    likedGrid.appendChild(
                        createSongCard(song, index)
                    );

                }

            });

            if (!likedSongs.length) {

                likedGrid.innerHTML = `
                    <div style="
                        color:#666;
                        padding:30px 0;
                        font-size:15px;
                    ">
                        You haven't liked any songs yet.
                    </div>
                `;

            }

        }

        /* =========================
           PAGE SWITCHING
        ========================= */

        function showPage(page, button) {

            document
                .querySelectorAll(".page")
                .forEach(p =>
                    p.classList.remove("active")
                );

            document
                .getElementById(page)
                .classList.add("active");

            document
                .querySelectorAll(".nav button")
                .forEach(b =>
                    b.classList.remove("active")
                );

            button.classList.add("active");

            const titles = {
                home: "AkkoFlac",
                songs: "Songs",
                liked: "Liked Songs"
            };

            document.getElementById(
                "pageTitle"
            ).textContent = titles[page];

        }

        /* =========================
           PLAY SONG
        ========================= */

        function playSong(index) {

            if (!songs[index]) return;

            currentIndex = index;

            const song = songs[index];

            audio.src = song.audio;

            miniCover.src = song.cover;

            miniTitle.textContent =
                song.title;

            miniArtist.textContent =
                song.artist;

            nowCover.src = song.cover;

            nowTitle.textContent =
                song.title;

            nowArtist.textContent =
                song.artist;

            main.classList.add("hidden");

            sidebar.style.opacity = "0";

            sidebar.style.pointerEvents =
                "none";

            bottomPlayer.classList.add("hidden");

            nowPlaying.classList.add("open");

            lastActiveIndex = -1;

            loadLyrics(song.lyrics);

            audio.currentTime = 0;

            audio.play()
                .then(
                    () => updatePlayButtons()
                )
                .catch(
                    () => updatePlayButtons()
                );

        }

        /* =========================
           CLOSE PLAYER
        ========================= */

        function closeNowPlaying() {

            nowPlaying.classList.remove("open");

            main.classList.remove("hidden");

            sidebar.style.opacity = "";

            sidebar.style.pointerEvents = "";

            if (!audio.paused) {

                bottomPlayer.classList.remove(
                    "hidden"
                );

            }

        }

        /* =========================
           PLAY / PAUSE
        ========================= */

        function togglePlay() {

            if (!audio.src) return;

            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        }

        audio.addEventListener(
            "play",
            updatePlayButtons
        );

        audio.addEventListener(
            "pause",
            updatePlayButtons
        );

        function updatePlayButtons() {

            const symbol =
                audio.paused ? "▶" : "Ⅱ";

            miniPlay.textContent =
                symbol;

            nowPlay.textContent =
                symbol;

        }

        /* =========================
           NEXT / PREVIOUS
        ========================= */

        function nextSong() {

            if (!songs.length) return;

            currentIndex++;

            if (
                currentIndex >= songs.length
            ) {

                currentIndex = 0;

            }

            playSong(currentIndex);

        }

        function previousSong() {

            if (audio.currentTime > 3) {

                audio.currentTime = 0;

                return;

            }

            currentIndex--;

            if (currentIndex < 0) {

                currentIndex =
                    songs.length - 1;

            }

            playSong(currentIndex);

        }

        /* =========================
           SEEK
        ========================= */

        function seekBack() {

            audio.currentTime =
                Math.max(
                    0,
                    audio.currentTime - 10
                );

        }

        function seekForward() {

            audio.currentTime =
                Math.min(
                    audio.duration || 0,
                    audio.currentTime + 10
                );

        }

        /* =========================
           REPEAT
        ========================= */

        function toggleRepeat() {

            repeat = !repeat;

        }

        audio.addEventListener(
            "ended",
            () => {

                if (repeat) {

                    audio.currentTime = 0;

                    audio.play();

                } else {

                    nextSong();

                }

            }
        );

        /* =========================
           PROGRESS
        ========================= */

        audio.addEventListener(
            "timeupdate",
            () => {

                if (!audio.duration) return;

                const value =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;

                progress.value = value;

                nowProgress.value = value;

                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );

                duration.textContent =
                    formatTime(
                        audio.duration
                    );

                updateLyrics(
                    audio.currentTime
                );

            }
        );

        progress.addEventListener(
            "input",
            () => {

                if (!audio.duration) return;

                audio.currentTime =
                    (
                        progress.value / 100
                    ) * audio.duration;

            }
        );

        nowProgress.addEventListener(
            "input",
            () => {

                if (!audio.duration) return;

                audio.currentTime =
                    (
                        nowProgress.value / 100
                    ) * audio.duration;

            }
        );

        function formatTime(seconds) {

            if (
                !seconds ||
                isNaN(seconds)
            ) {

                return "0:00";

            }

            const mins =
                Math.floor(seconds / 60);

            const secs =
                Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

            return `${mins}:${secs}`;

        }

        /* =========================
           LOAD LYRICS
        ========================= */

        async function loadLyrics(url) {

            lyricsContainer.innerHTML = "";

            currentLyrics = [];

            lastActiveIndex = -1;

            try {

                const response =
                    await fetch(url);

                if (!response.ok) {

                    throw new Error(
                        "Lyrics unavailable"
                    );

                }

                const text =
                    await response.text();

                currentLyrics =
                    parseLRC(text);

                if (!currentLyrics.length) {

                    lyricsContainer.innerHTML = `
                        <div class="lyric-line">
                            No lyrics found.
                        </div>
                    `;

                    return;

                }

                currentLyrics.forEach(
                    (line, index) => {

                        const element =
                            document.createElement(
                                "div"
                            );

                        element.className =
                            "lyric-line";

                        element.dataset.index =
                            index;

                        element.textContent =
                            line.text;

                        lyricsContainer.appendChild(
                            element
                        );

                    }
                );

            } catch (error) {

                lyricsContainer.innerHTML = `
                    <div class="lyric-line">
                        Lyrics could not be loaded.
                    </div>
                `;

            }

        }

        /* =========================
           LRC PARSER
        ========================= */

        function parseLRC(text) {

            const lines = [];

            text
                .split(/\r?\n/)
                .forEach(line => {

                    const matches = [
                        ...line.matchAll(
                            /\[(\d+):(\d+(?:\.\d+)?)\]/g
                        )
                    ];

                    const lyric =
                        line
                            .replace(
                                /\[\d+:\d+(?:\.\d+)?\]/g,
                                ""
                            )
                            .trim();

                    matches.forEach(match => {

                        const minutes =
                            parseInt(match[1]);

                        const seconds =
                            parseFloat(match[2]);

                        lines.push({
                            time:
                                minutes * 60 +
                                seconds,

                            text:
                                lyric || "♪"
                        });

                    });

                });

            lines.sort(
                (a, b) =>
                    a.time - b.time
            );

            return lines;

        }

        /* =========================
           SYNC LYRICS
        ========================= */

        function updateLyrics(time) {

            if (!currentLyrics.length) {
                return;
            }

            let activeIndex = -1;

            for (
                let i = 0;
                i < currentLyrics.length;
                i++
            ) {

                if (
                    time >= currentLyrics[i].time
                ) {

                    activeIndex = i;

                } else {

                    break;

                }

            }

            /* Don't constantly update the
               DOM while the same lyric plays. */

            if (
                activeIndex === lastActiveIndex
            ) {

                return;

            }

            lastActiveIndex =
                activeIndex;

            const elements =
                document.querySelectorAll(
                    ".lyric-line"
                );

            elements.forEach(
                (element, index) => {

                    element.classList.remove(
                        "active",
                        "past"
                    );

                    if (
                        index < activeIndex
                    ) {

                        element.classList.add(
                            "past"
                        );

                    }

                    if (
                        index === activeIndex
                    ) {

                        element.classList.add(
                            "active"
                        );

                    }

                }
            );

            /* Smoothly follow the current
               lyric without forcing the
               whole panel to jump. */

            if (activeIndex >= 0) {

                const activeElement =
                    elements[activeIndex];

                if (activeElement) {

                    activeElement.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest"
                    });

                }

            }

        }

        /* =========================
           LIKES
        ========================= */

        function toggleLike(id) {

            if (
                likedSongs.includes(id)
            ) {

                likedSongs =
                    likedSongs.filter(
                        songId =>
                            songId !== id
                    );

            } else {

                likedSongs.push(id);

            }

            localStorage.setItem(
                "likedSongs",
                JSON.stringify(likedSongs)
            );

            renderSongs();

        }

        /* =========================
           SEARCH
        ========================= */

        search.addEventListener(
            "input",
            () => {

                const query =
                    search.value
                        .toLowerCase()
                        .trim();

                document
                    .querySelectorAll(
                        ".song-card"
                    )
                    .forEach(card => {

                        const text =
                            card.textContent
                                .toLowerCase();

                        card.style.display =
                            text.includes(query)
                                ? ""
                                : "none";

                    });

            }
        );

        /* =========================
           KEYBOARD CONTROLS
        ========================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.code === "Space" &&
                    document.activeElement !== search
                ) {

                    event.preventDefault();

                    togglePlay();

                }

                if (
                    event.key === "ArrowRight"
                ) {

                    seekForward();

                }

                if (
                    event.key === "ArrowLeft"
                ) {

                    seekBack();

                }

                if (
                    event.key === "Escape" &&
                    nowPlaying.classList.contains(
                        "open"
                    )
                ) {

                    closeNowPlaying();

                }

            }
        );

        /* =========================
           INITIALIZE
        ========================= */

        renderFeatured();

        renderSongs();

    </script>

</body>

</html>
